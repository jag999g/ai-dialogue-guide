    /* ==========================================================================

      --accent-2: #B8654B;
      --accent-2-soft: rgba(184, 101, 75, 0.10);
      --accent-2-border: rgba(184, 101, 75, 0.28);
      --header-bg: rgba(249, 246, 240, 0.88);
      --shadow-sm: 0 1px 2px rgba(34, 37, 36, 0.04);
      --shadow-md: 0 8px 24px -6px rgba(34, 37, 36, 0.07);

      --bg: #16181A;
      --surface: #1E2124;
      --surface-warm: #22262A;
      --surface-subtle: #25292D;
      --border: #30353B;
      --text: #ECE8DF;
      --text-muted: #9EA4AA;
      --accent: #D4A853;
      --accent-hover: #E2BA6A;
      --accent-contrast: #16181A;
      --accent-soft: rgba(212, 168, 83, 0.12);
      --accent-border: rgba(212, 168, 83, 0.30);
      --accent-2: #7BA891;
      --accent-2-soft: rgba(123, 168, 145, 0.13);
      --accent-2-border: rgba(123, 168, 145, 0.30);
      --header-bg: rgba(22, 24, 26, 0.88);
      --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.25);
      --shadow-md: 0 10px 28px -6px rgba(0, 0, 0, 0.38);
    }

    /* Base Typography & Smooth Theme Transitions */
    html {
      scroll-behavior: smooth;
      background-color: var(--bg);
      color: var(--text);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      font-size: 16px;
      line-height: 1.65;
      -webkit-font-smoothing: antialiased;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      transition: background-color 0.25s ease, color 0.25s ease;
      overflow-x: hidden;
    }

    .font-serif-editorial {
      font-family: 'Lora', Georgia, serif;
    }

    /* Surface & Utility Helpers tied to CSS Variables */
    .surface-card {
      background-color: var(--surface);
      border: 1px solid var(--border);
      box-shadow: var(--shadow-sm);
      transition: border-color 0.2s ease, box-shadow 0.2s ease, background-color 0.25s ease, transform 0.2s ease;
    }

    .surface-card-hover:hover {
      border-color: var(--accent-border);
      box-shadow: var(--shadow-md);
    }

    .surface-warm {
      background-color: var(--surface-warm);
      border: 1px solid var(--border);
    }

    .surface-subtle {
      background-color: var(--surface-subtle);
      border: 1px solid var(--border);
    }

    .text-muted {
      color: var(--text-muted);
    }

    .text-accent {
      color: var(--accent);
    }

    .text-accent-2 {
      color: var(--accent-2);
    }

    .bg-accent {
      background-color: var(--accent);
      color: var(--accent-contrast);
    }

    .bg-accent:hover {
      background-color: var(--accent-hover);
    }

    .bg-accent-soft {
      background-color: var(--accent-soft);
      color: var(--accent);
      border: 1px solid var(--accent-border);
    }

    .bg-accent-2-soft {
      background-color: var(--accent-2-soft);
      color: var(--accent-2);
      border: 1px solid var(--accent-2-border);
    }

    .border-theme {
      border-color: var(--border);
    }

    /* Glassmorphic Sticky Header */
    .site-header {
      background-color: var(--header-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
    }

    /* Horizontal Scrollbar Hiding for Mobile Tabs */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    /* Navigation Tabs */
    .nav-tab {
      color: var(--text-muted);
      border-bottom: 2px solid transparent;
      transition: color 0.18s ease, border-color 0.18s ease;
    }
    .nav-tab:hover {
      color: var(--text);
    }
    .nav-tab.active {
      color: var(--accent);
      border-bottom-color: var(--accent);
      font-weight: 600;
    }

    /* Pill Buttons (Lessons, Filters) */
    .pill-btn {
      background-color: var(--surface);
      color: var(--text-muted);
      border: 1px solid var(--border);
      transition: all 0.18s ease;
    }
    .pill-btn:hover {
      color: var(--text);
      border-color: var(--accent-border);
    }
    .pill-btn.active {
      background-color: var(--accent);
      color: var(--accent-contrast);
      border-color: var(--accent);
      font-weight: 500;
    }

    /* Highlight Pulse when jumping to a Scenario from Home */
    @keyframes highlightRing {
      0% { box-shadow: 0 0 0 0 var(--accent-border); border-color: var(--accent); }
      40% { box-shadow: 0 0 0 6px var(--accent-soft); border-color: var(--accent); }
      100% { box-shadow: var(--shadow-sm); border-color: var(--border); }
    }
    .scenario-highlight {
      animation: highlightRing 2.2s ease-out;
    }

    /* Subtle Fade-In for View Switching */
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-view {
      animation: fadeInUp 0.25s ease-out;
    }

    /* Toast Notification */
    #toast {
      background-color: var(--text);
      color: var(--bg);
      transition: opacity 0.22s ease, transform 0.22s ease;
    }

    /* Access badges (direct / VPN) */
    .badge-ok {
      background-color: rgba(46, 125, 80, 0.10);
      color: #2E7D50;
      border: 1px solid rgba(46, 125, 80, 0.25);

    .badge-vpn {
      background-color: rgba(196, 140, 30, 0.12);
      color: #8A5A00;
      border: 1px solid rgba(196, 140, 30, 0.30);
    }

      border-color: rgba(110, 190, 140, 0.30);

        color: #1A1A1A !important;

        padding: 0 !important;
        margin: 0 !important;
      }
      a {
        text-decoration: none !important;
        color: #1A1A1A !important;
      }

    /* ------------------------------------------------------------------------
       2. APPLICATION STATE & PERSISTENCE
       ------------------------------------------------------------------------ */
    const state = {
      lang: 'ru',
      theme: 'light',
      tab: 'home',
      lesson: 1,
      scenarioFilter: 'all',
      openGlossary: 0, // First glossary item open by default
      highlightScenarioId: null
    };

    let toastTimer = null;

    /* Safe storage: some private modes block localStorage */
    function lsGet(key) { try { return localStorage.getItem(key); } catch (e) { return null; } }
    function lsSet(key, value) { try { localStorage.setItem(key, value); } catch (e) { /* ignore */ } }

    /* Initialize Language from URL Hash (#ru / #en) or localStorage */
    function initLanguage() {
      const hash = window.location.hash.toLowerCase();
      if (hash === '#en') {
        state.lang = 'en';
      } else if (hash === '#ru') {
        state.lang = 'ru';
      } else {
        const saved = lsGet('aidg_lang');
        if (saved === 'en' || saved === 'ru') {
          state.lang = saved;
        }
      }
    }

    /* Initialize Theme from localStorage or System Preference */
    function initTheme() {
      const saved = lsGet('aidg_theme');
      if (saved === 'dark' || saved === 'light') {
        state.theme = saved;
      } else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
        state.theme = 'dark';
      }
      applyTheme();
    }

    function applyTheme() {
      document.documentElement.setAttribute('data-theme', state.theme);
      const sun = document.getElementById('icon-sun');
      const moon = document.getElementById('icon-moon');
      if (state.theme === 'dark') {
        sun.classList.remove('hidden');
        moon.classList.add('hidden');
      } else {
        sun.classList.add('hidden');
        moon.classList.remove('hidden');
      }
    }

    function toggleTheme() {
      state.theme = state.theme === 'light' ? 'dark' : 'light';
      lsSet('aidg_theme', state.theme);
      applyTheme();
    }

    function setLanguage(lang, updateHash = true) {
      if (lang !== 'ru' && lang !== 'en') return;
      state.lang = lang;
      lsSet('aidg_lang', lang);
      document.documentElement.lang = lang;
      if (updateHash) {
        // Update hash cleanly without jumping scroll
        try {
          history.replaceState(null, '', '#' + lang);
        } catch (e) {
          window.location.hash = lang;
        }
      }
      renderAll();
    }

    /* Listen for external hash changes (#ru / #en) */
    window.addEventListener('hashchange', () => {
      const hash = window.location.hash.toLowerCase();
      if (hash === '#en' && state.lang !== 'en') {
        setLanguage('en', false);
      } else if (hash === '#ru' && state.lang !== 'ru') {
        setLanguage('ru', false);
      }
    });

    /* ------------------------------------------------------------------------
       3. NAVIGATION & SCROLLING HELPERS
       ------------------------------------------------------------------------ */
    function navigateTo(tab, options = {}) {
      state.tab = tab;
      if (options.lesson) {
        state.lesson = options.lesson;
      }
      if (options.filter) {
        state.scenarioFilter = options.filter;
      }
      if (options.scenarioId) {
        state.scenarioFilter = 'all';
        state.highlightScenarioId = options.scenarioId;
      } else {
        state.highlightScenarioId = null;
      }

      renderAll();

      if (options.scenarioId) {
        requestAnimationFrame(() => {
          const el = document.getElementById('scenario-' + options.scenarioId);
          if (el) {
            el.scrollIntoView({ behavior: 'smooth', block: 'center' });
          }
        });
      } else if (options.anchor) {
        requestAnimationFrame(() => {
          const el = document.getElementById(options.anchor);
          if (el) {
            el.scrollIntoView({ behavior: 'smooth', block: 'start' });
          }
        });
      } else {
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }
    }

    function scrollToDoors() {
      const el = document.getElementById('open-doors');
      if (el) {
        el.scrollIntoView({ behavior: 'smooth', block: 'start' });
      }
    }

    function selectLesson(num) {
      state.lesson = num;
      renderMain();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function selectScenarioFilter(filterId) {
      state.scenarioFilter = filterId;
      state.highlightScenarioId = null;
      renderMain();
    }

    function toggleGlossaryItem(index) {
      state.openGlossary = state.openGlossary === index ? -1 : index;
      renderMain();
    }

    /* ------------------------------------------------------------------------
       4. CLIPBOARD COPY (iFrame-safe using execCommand) + TOAST
       ------------------------------------------------------------------------ */
    function copyPromptText(encodedText, btnEl) {
      const text = decodeURIComponent(encodedText);
      const t = CONTENT[state.lang];

      const fallbackCopy = (str) => {
        const ta = document.createElement('textarea');
        ta.value = str;
        ta.setAttribute('readonly', '');
        ta.style.position = 'fixed';
        ta.style.top = '-9999px';
        ta.style.left = '-9999px';
        document.body.appendChild(ta);
        ta.select();
        try {
          document.execCommand('copy');
        } catch (err) {
          console.error('Copy failed', err);
        }
        document.body.removeChild(ta);
      };

      fallbackCopy(text);

      // Update button label briefly
      if (btnEl) {
        const labelSpan = btnEl.querySelector('.copy-label');
        if (labelSpan) {
          labelSpan.textContent = t.copiedBtn;
          setTimeout(() => {
            labelSpan.textContent = CONTENT[state.lang].copyBtn;
          }, 1600);
        }
      }

      // Show toast
      showToast(t.copiedToast);
    }

    function showToast(message) {
      const toast = document.getElementById('toast');
      const toastText = document.getElementById('toast-text');
      toastText.textContent = message;
      toast.classList.remove('opacity-0', 'translate-y-2', 'pointer-events-none');
      toast.classList.add('opacity-100', 'translate-y-0');

      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => {
        toast.classList.add('opacity-0', 'translate-y-2', 'pointer-events-none');
        toast.classList.remove('opacity-100', 'translate-y-0');
      }, 2200);
    }

    /* Utility to safely escape HTML */
    function esc(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    /* Reusable Copy Button HTML */
    function renderCopyBtn(text) {
      const t = CONTENT[state.lang];
      const encoded = encodeURIComponent(text).replace(/'/g, '%27');
      return `
        <button type="button" onclick="copyPromptText('${encoded}', this)" class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs font-medium surface-card hover:text-accent cursor-pointer shrink-0 no-print">
          <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
            <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
          </svg>
          <span class="copy-label">${esc(t.copyBtn)}</span>
        </button>
      `;
    }

    /* ------------------------------------------------------------------------
       5. RENDER FUNCTIONS FOR HEADER, NAV, FOOTER & ALL 5 VIEWS
       ------------------------------------------------------------------------ */
    function renderChrome() {
      const t = CONTENT[state.lang];
      document.title = t.metaTitle;
      document.documentElement.lang = state.lang;

      document.getElementById('brand-title').textContent = t.brandTitle;
      document.getElementById('brand-subtitle').textContent = t.brandSubtitle;
      document.getElementById('btn-print').title = t.printTitle;
      document.getElementById('btn-theme').title = t.themeTitle;
      document.getElementById('footer-title').textContent = t.footerTitle;
      document.getElementById('footer-credit').textContent = t.footerCredit;

      // Update RU / EN pill active state
      const btnRu = document.getElementById('btn-lang-ru');
      const btnEn = document.getElementById('btn-lang-en');
      if (state.lang === 'ru') {
        btnRu.className = 'px-2.5 py-1 text-xs font-semibold rounded-full bg-accent cursor-pointer';
        btnEn.className = 'px-2.5 py-1 text-xs font-medium rounded-full text-muted hover:text-accent cursor-pointer';
      } else {
        btnEn.className = 'px-2.5 py-1 text-xs font-semibold rounded-full bg-accent cursor-pointer';
        btnRu.className = 'px-2.5 py-1 text-xs font-medium rounded-full text-muted hover:text-accent cursor-pointer';
      }

      // Render Navigation Tabs
      const navEl = document.getElementById('main-nav');
      navEl.innerHTML = t.nav.map(item => `
        <button onclick="navigateTo('${item.id}')" class="nav-tab whitespace-nowrap py-3 text-sm cursor-pointer ${state.tab === item.id ? 'active' : ''}">
          ${esc(item.label)}
        </button>
      `).join('');
    }

    /* Shared: access badge + model card (used in B-3 and "Meet More Partners") */
    function renderAccessBadge(kind) {
      const label = CONTENT[state.lang].accessLabels[kind] || kind;
      return `<span class="badge-${kind} inline-block text-xs px-2 py-0.5 rounded-md font-medium whitespace-nowrap">${esc(label)}</span>`;
    }

    function renderModelCard(m) {
      const L = CONTENT[state.lang].modelLabels;
      return `
        <div class="p-5 rounded-2xl surface-card flex flex-col gap-2.5">
          <div class="flex flex-wrap items-center justify-between gap-2">
            <h4 class="font-serif-editorial font-semibold text-lg">${esc(m.name)}</h4>
            <span class="text-xs px-2.5 py-0.5 rounded-full bg-accent-soft">${esc(m.badge)}</span>
          </div>
          ${m.maker ? `<div class="text-[11px] uppercase tracking-wider text-muted -mt-1">${esc(m.maker)}</div>` : ''}
          <p class="text-sm text-muted leading-relaxed">${esc(m.desc)}</p>
          ${m.extra ? `
            <dl class="text-xs sm:text-sm text-muted leading-relaxed space-y-1.5 pt-2.5 border-t border-theme">
              <div><dt class="inline font-semibold text-[var(--text)]">${esc(L.extra)}:</dt> <dd class="inline">${esc(m.extra)}</dd></div>
              <div><dt class="inline font-semibold text-[var(--text)]">${esc(L.free)}:</dt> <dd class="inline">${esc(m.free)}</dd></div>
              <div><dt class="inline font-semibold text-[var(--text)]">${esc(L.access)}:</dt> <dd class="inline">${renderAccessBadge(m.access)}${m.accessNote ? ' ' + esc(m.accessNote) : ''}</dd></div>
            </dl>
          ` : ''}
        </div>
      `;
    }

    /* VIEW 1: HOME */
    function renderHome() {

              ${esc(h.subtitle)}

          <!-- Mirror Block: 3 Contrasting Profession Cards -->

                ${esc(h.mirrorHeading)}

              <p class="text-sm sm:text-base text-muted">

              </p>

            <div class="grid grid-cols-1 md:grid-cols-3 gap-5">

                    <div class="font-serif-editorial text-lg font-semibold mb-2.5 group-hover:text-accent transition-colors">

                      ${esc(card.text)}
                    </p>

                  <div class="text-xs font-medium text-accent pt-1">

                  </div>

          </section>

          <!-- Four Open Doors -->
          <section id="open-doors" class="scroll-mt-28">
            <div class="mb-6">
              <h2 class="font-serif-editorial text-2xl sm:text-3xl font-semibold mb-2">
                ${esc(h.doorsHeading)}
              </h2>
              <p class="text-sm sm:text-base text-muted">
                ${esc(h.doorsSub)}
              </p>
            </div>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
              ${h.doors.map(door => `
                <div class="p-6 sm:p-7 rounded-2xl surface-card flex flex-col justify-between gap-5">

                    <div class="flex items-center gap-3 mb-3">
                      <span class="text-xs font-semibold px-2.5 py-1 rounded-lg bg-accent-soft">${esc(door.num)}</span>
                      <h3 class="font-serif-editorial text-xl font-semibold">${esc(door.title)}</h3>
                    </div>
                    <p class="text-sm text-muted leading-relaxed mb-4">
                      ${esc(door.desc)}
                    </p>
                    ${door.note ? `
                      <div class="text-xs px-3.5 py-2.5 rounded-xl bg-accent-2-soft mb-4 leading-relaxed">
                        ${esc(door.note)}
                      </div>
                    ` : ''}
                  </div>
                  <div class="space-y-2 pt-3 border-t border-theme">
                    ${door.links.map(link => {
                      const opts = JSON.stringify(link.action).replace(/"/g, '&quot;');
                      return `
                        <button onclick="navigateTo('${link.action.tab}', ${opts})" class="w-full text-left flex items-center justify-between px-3 py-2 rounded-xl text-sm hover:bg-[var(--surface-subtle)] transition-colors cursor-pointer group">
                          <span class="font-medium group-hover:text-accent transition-colors">${esc(link.label)}</span>
                          <span class="text-muted group-hover:text-accent">→</span>

              `).join('')}
            </div>
          </section>

          <!-- Quick Anchors -->
          <section>
            <div class="mb-5">
              <h2 class="font-serif-editorial text-xl sm:text-2xl font-semibold mb-1.5">

              </h2>
              <p class="text-sm text-muted">
                ${esc(h.anchorsSub)}
              </p>
            </div>
            <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
              ${h.anchors.map(anchor => {
                const opts = JSON.stringify(anchor.action).replace(/"/g, '&quot;');
                return `
                  <button onclick="navigateTo('${anchor.action.tab}', ${opts})" class="text-left p-5 rounded-2xl surface-warm surface-card-hover cursor-pointer group">
                    <div class="font-serif-editorial font-semibold text-base mb-1.5 group-hover:text-accent transition-colors">
                      ${esc(anchor.title)} →

            </div>
          </section>
        </div>

    /* VIEW 2: BASICS (B-1 .. B-7) */
    function renderBasics() {
      const t = CONTENT[state.lang];
      const b = t.basics;
      const lesson = b.lessons.find(l => l.num === state.lesson) || b.lessons[0];

      const renderBlock = (block) => {
        if (block.type === 'prose') {
          return `
            <div class="space-y-4 text-base leading-relaxed">
              ${block.paragraphs.map(p => `<p>${esc(p)}</p>`).join('')}
            </div>
          `;
        }

        if (block.type === 'dialogue') {
          return `
            <div class="space-y-4">
              <h3 class="font-serif-editorial text-xl font-semibold">${esc(block.heading)}</h3>
              <div class="space-y-4">
                ${block.steps.map(st => `
                  <div class="p-5 rounded-2xl surface-warm space-y-3">
                    <div class="text-xs font-semibold uppercase tracking-wider text-accent">${esc(st.label)}</div>
                    <div class="space-y-2.5 text-sm sm:text-base">
                      <div class="p-3.5 rounded-xl surface-card">
                        <span class="font-semibold text-accent mr-1.5">${state.lang === 'ru' ? 'Вы:' : 'You:'}</span>
                        <span>${esc(st.user)}</span>
                      </div>
                      <div class="p-3.5 rounded-xl surface-subtle">
                        <span class="font-semibold text-accent-2 mr-1.5">${state.lang === 'ru' ? 'ИИ:' : 'AI:'}</span>
                        <span class="italic font-serif-editorial">${esc(st.ai)}</span>
                      </div>
                    </div>
                    <p class="text-xs sm:text-sm text-muted pt-1">${esc(st.comment)}</p>
                  </div>
                `).join('')}
              </div>
            </div>
          `;
        }

        if (block.type === 'prompt') {
          return `
            <div class="p-5 sm:p-6 rounded-2xl surface-subtle space-y-3">
              <div class="flex flex-wrap items-center justify-between gap-3">
                <h3 class="font-serif-editorial text-lg font-semibold">${esc(block.heading)}</h3>
                ${renderCopyBtn(block.text)}
              </div>
              ${block.desc ? `<p class="text-sm text-muted">${esc(block.desc)}</p>` : ''}
              <div class="p-4 rounded-xl surface-card font-serif-editorial text-sm sm:text-base leading-relaxed">
                ${esc(block.text)}
              </div>
            </div>
          `;
        }

        if (block.type === 'phrases') {
          return `
            <div class="space-y-3">
              <h3 class="font-serif-editorial text-xl font-semibold">${esc(block.heading)}</h3>
              <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                ${block.items.map(phrase => `
                  <div class="p-4 rounded-xl surface-card flex items-start justify-between gap-3">
                    <p class="text-sm font-serif-editorial italic leading-relaxed">«${esc(phrase)}»</p>
                    ${renderCopyBtn(phrase)}
                  </div>
                `).join('')}
              </div>
            </div>
          `;
        }

        if (block.type === 'cards') {
          const gridClass = block.cols === 2 ? 'md:grid-cols-2' : 'md:grid-cols-3';
          return `
            <div class="space-y-4">
              <h3 class="font-serif-editorial text-xl font-semibold">${esc(block.heading)}</h3>
              <div class="grid grid-cols-1 ${gridClass} gap-4">
                ${block.items.map(item => `
                  <div class="p-5 rounded-2xl surface-card space-y-2">
                    <h4 class="font-serif-editorial font-semibold text-base">${esc(item.title)}</h4>
                    <p class="text-sm text-muted leading-relaxed">${esc(item.text)}</p>
                  </div>
                `).join('')}
              </div>
            </div>
          `;
        }

        if (block.type === 'callout') {
          const cls = block.tone === 'secondary' ? 'bg-accent-2-soft' : 'bg-accent-soft';
          return `
            <div class="p-5 sm:p-6 rounded-2xl ${cls} space-y-3">
              <h3 class="font-serif-editorial text-lg font-semibold">${esc(block.heading)}</h3>
              <ul class="space-y-2.5 text-sm sm:text-base leading-relaxed text-[var(--text)]">
                ${block.items.map(it => `<li class="flex gap-2.5"><span class="mt-1.5 w-1.5 h-1.5 rounded-full bg-current shrink-0 opacity-70"></span><span>${esc(it)}</span></li>`).join('')}
              </ul>
            </div>
          `;
        }

        if (block.type === 'modelsGrid') {
          const gridClass = block.cols === 2 ? 'md:grid-cols-2' : 'md:grid-cols-2 lg:grid-cols-3';
          return `
            <div class="space-y-3">
              <div>
                <h3 class="font-serif-editorial text-xl font-semibold">${esc(block.heading)}</h3>
                ${block.sub ? `<p class="text-sm text-muted mt-1">${esc(block.sub)}</p>` : ''}
              </div>
              <div class="grid grid-cols-1 ${gridClass} gap-4">
                ${block.items.map(renderModelCard).join('')}
              </div>
            </div>
          `;
        }

        if (block.type === 'invite') {
          const opts = JSON.stringify(block.action).replace(/"/g, '&quot;');
          return `
            <div class="p-5 sm:p-6 rounded-2xl surface-warm flex flex-col sm:flex-row sm:items-center justify-between gap-4">
              <div class="space-y-1.5">
                <h3 class="font-serif-editorial text-lg font-semibold">${esc(block.heading)}</h3>
                <p class="text-sm text-muted leading-relaxed">${esc(block.text)}</p>
              </div>
              <button onclick="navigateTo('${block.action.tab}', ${opts})" class="px-4 py-2.5 rounded-xl text-sm font-medium bg-accent whitespace-nowrap self-start sm:self-auto cursor-pointer no-print">
                ${esc(block.btnLabel)} →
              </button>
            </div>
          `;
        }

        if (block.type === 'mutedBox') {
          return `
            <div class="p-5 rounded-2xl surface-subtle space-y-3">
              <h3 class="font-serif-editorial text-base font-semibold">${esc(block.heading)}</h3>
              <p class="text-sm text-muted">${esc(block.intro)}</p>
              <ul class="space-y-2 text-sm leading-relaxed">
                ${block.items.map(it => `
                  <li><strong class="font-semibold">${esc(it.name)}</strong> — <span class="text-muted">${esc(it.text)}</span></li>
                `).join('')}
              </ul>
            </div>
          `;
        }

        if (block.type === 'table') {
          return `
            <div class="space-y-3">
              <h3 class="font-serif-editorial text-xl font-semibold">${esc(block.heading)}</h3>
              <div class="overflow-x-auto rounded-2xl border border-theme surface-card">
                <table class="w-full text-left border-collapse text-sm">
                  <thead>
                    <tr class="surface-subtle border-b border-theme">
                      ${block.headers.map(h => `<th class="py-3 px-4 font-semibold text-xs uppercase tracking-wider text-muted">${esc(h)}</th>`).join('')}
                    </tr>
                  </thead>
                  <tbody class="divide-y divide-[var(--border)]">
                    ${block.rows.map(row => `
                      <tr>
                        ${row.map((cell, idx) => `<td class="py-3.5 px-4 align-top ${idx === 1 ? 'font-medium text-accent' : ''}">${esc(cell)}</td>`).join('')}
                      </tr>
                    `).join('')}
                  </tbody>
                </table>
              </div>
              ${block.footnote ? `<p class="text-xs sm:text-sm text-muted italic">${esc(block.footnote)}</p>` : ''}
            </div>
          `;
        }

        if (block.type === 'beforeAfter') {
          return `
            <div class="space-y-3">
              <h3 class="font-serif-editorial text-xl font-semibold">${esc(block.heading)}</h3>
              <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div class="p-5 rounded-2xl surface-subtle space-y-2">
                  <div class="text-xs font-semibold uppercase tracking-wider text-accent-2">${esc(block.beforeLabel)}</div>
                  <p class="text-sm sm:text-base font-serif-editorial italic">«${esc(block.beforeText)}»</p>
                </div>
                <div class="p-5 rounded-2xl surface-card border-2 border-[var(--accent-border)] space-y-2">
                  <div class="text-xs font-semibold uppercase tracking-wider text-accent">${esc(block.afterLabel)}</div>
                  <p class="text-sm sm:text-base font-serif-editorial">«${esc(block.afterText)}»</p>
                </div>
              </div>
            </div>
          `;
        }

        if (block.type === 'pathways') {
          return `
            <div class="space-y-4">
              <h3 class="font-serif-editorial text-xl font-semibold">${esc(block.heading)}</h3>
              <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                ${block.items.map(p => {
                  const opts = JSON.stringify(p.action).replace(/"/g, '&quot;');
                  return `
                    <div class="p-5 rounded-2xl surface-card flex flex-col justify-between gap-4">
                      <div class="space-y-2">
                        <h4 class="font-serif-editorial font-semibold text-base">${esc(p.title)}</h4>
                        <p class="text-sm text-muted leading-relaxed">${esc(p.desc)}</p>
                      </div>
                      <button onclick="navigateTo('${p.action.tab}', ${opts})" class="w-full py-2.5 px-4 rounded-xl text-xs sm:text-sm font-medium bg-accent-soft hover:opacity-90 transition-opacity cursor-pointer no-print">
                        ${esc(p.btnLabel)} →
                      </button>
                    </div>
                  `;
                }).join('')}
              </div>
            </div>
          `;
        }

        return '';
      };

      return `
        <div class="space-y-8 animate-view">
          <!-- Module Header -->
          <div>
            <h1 class="font-serif-editorial text-2xl sm:text-4xl font-semibold mb-2">${esc(b.heading)}</h1>
            <p class="text-sm sm:text-base text-muted">${esc(b.sub)}</p>
          </div>

          <!-- Lesson Pill Bar -->
          <div class="flex flex-wrap gap-2 no-print" role="tablist" aria-label="Lessons">
            ${b.lessons.map(l => `
              <button onclick="selectLesson(${l.num})" class="pill-btn px-3.5 py-2 rounded-xl text-xs sm:text-sm cursor-pointer ${l.num === state.lesson ? 'active' : ''}">
                <span class="font-semibold mr-1">${esc(l.code)}</span> ${esc(l.shortTitle)}
              </button>
            `).join('')}
          </div>

          <!-- Active Lesson Article -->
          <article class="p-6 sm:p-10 rounded-3xl surface-card space-y-8">
            <header class="space-y-3 pb-6 border-b border-theme">
              <div class="flex flex-wrap items-center gap-3 text-xs">
                <span class="px-2.5 py-1 rounded-lg font-semibold bg-accent-soft">${esc(lesson.code)}</span>
                <span class="text-muted">${esc(lesson.time)}</span>
              </div>
              <h2 class="font-serif-editorial text-2xl sm:text-3xl font-semibold leading-snug">
                ${esc(lesson.title)}
              </h2>
              <p class="text-base text-muted leading-relaxed">
                ${esc(lesson.lead)}
              </p>
            </header>

            <!-- Lesson Blocks -->
            <div class="space-y-8">
              ${lesson.blocks.map(renderBlock).join('')}
            </div>

            <!-- Success Criteria Card -->
            <div class="p-5 sm:p-6 rounded-2xl bg-accent-soft space-y-2">
              <div class="text-xs font-semibold uppercase tracking-wider text-accent">
                ${esc(t.successTitle)}
              </div>
              <p class="text-sm sm:text-base text-[var(--text)] leading-relaxed">
                ${esc(lesson.success)}
              </p>
            </div>

            <!-- Prev / Next Lesson Controls -->
            <div class="flex items-center justify-between gap-4 pt-6 border-t border-theme no-print">
              ${lesson.num > 1 ? `
                <button onclick="selectLesson(${lesson.num - 1})" class="px-4 py-2.5 rounded-xl text-sm font-medium surface-warm surface-card-hover cursor-pointer">
                  ← ${esc(t.prevLesson)}
                </button>
              ` : '<div></div>'}
              ${lesson.num < 7 ? `
                <button onclick="selectLesson(${lesson.num + 1})" class="px-5 py-2.5 rounded-xl text-sm font-medium bg-accent cursor-pointer">
                  ${esc(t.nextLesson)} →
                </button>
              ` : `
                <button onclick="navigateTo('scenarios')" class="px-5 py-2.5 rounded-xl text-sm font-medium bg-accent cursor-pointer">
                  ${state.lang === 'ru' ? 'Перейти к сценариям →' : 'Explore Scenarios →'}
                </button>
              `}
            </div>
          </article>
        </div>
      `;
    }

    /* VIEW 3: SCENARIOS (12) */
    function renderScenarios() {
      const t = CONTENT[state.lang];
      const sc = t.scenarios;
      const filtered = state.scenarioFilter === 'all'
        ? sc.items
        : sc.items.filter(item => item.category === state.scenarioFilter);

      return `
        <div class="space-y-8 animate-view">
          <div>
            <h1 class="font-serif-editorial text-2xl sm:text-4xl font-semibold mb-2">${esc(sc.heading)}</h1>
            <p class="text-sm sm:text-base text-muted max-w-3xl">${esc(sc.sub)}</p>
          </div>

          <!-- Category Filter Pills -->
          <div class="flex flex-wrap gap-2 no-print">
            ${sc.filters.map(f => `
              <button onclick="selectScenarioFilter('${f.id}')" class="pill-btn px-4 py-2 rounded-full text-xs sm:text-sm cursor-pointer ${state.scenarioFilter === f.id ? 'active' : ''}">
                ${esc(f.label)}
              </button>
            `).join('')}
          </div>

          <!-- Scenario Cards Grid -->
          <div class="grid grid-cols-1 gap-6">
            ${filtered.map(item => `
              <article id="scenario-${item.id}" class="p-6 sm:p-8 rounded-3xl surface-card space-y-5 scroll-mt-28 ${state.highlightScenarioId === item.id ? 'scenario-highlight' : ''}">
                <!-- Header -->
                <div class="space-y-2">
                  <div class="flex flex-wrap items-center gap-2.5">
                    <span class="px-3 py-1 rounded-full text-xs font-semibold bg-accent-soft">${esc(item.role)}</span>
                    <span class="text-xs text-muted">${esc(item.categoryLabel)}</span>
                  </div>
                  <h2 class="font-serif-editorial text-xl sm:text-2xl font-semibold leading-snug">
                    ${esc(item.title)}
                  </h2>
                </div>

                <!-- Situation -->
                <div class="text-sm sm:text-base text-muted leading-relaxed">
                  <strong class="text-[var(--text)] font-medium">${esc(t.situationLabel)}:</strong> ${esc(item.situation)}
                </div>

                <!-- Two Dialogue Steps -->
                <div class="grid grid-cols-1 lg:grid-cols-2 gap-4">
                  <!-- Step 1 -->
                  <div class="p-5 rounded-2xl surface-warm flex flex-col justify-between gap-3">
                    <div class="space-y-2.5">
                      <div class="flex items-center justify-between gap-2">
                        <span class="text-xs font-semibold text-accent">${esc(item.step1Title)}</span>
                        ${renderCopyBtn(item.step1Prompt)}
                      </div>
                      <p class="text-sm font-serif-editorial leading-relaxed">«${esc(item.step1Prompt)}»</p>
                    </div>
                  </div>
                  <!-- Step 2 -->
                  <div class="p-5 rounded-2xl surface-subtle flex flex-col justify-between gap-3">
                    <div class="space-y-2.5">
                      <div class="flex items-center justify-between gap-2">
                        <span class="text-xs font-semibold text-accent-2">${esc(item.step2Title)}</span>
                        ${renderCopyBtn(item.step2Prompt)}
                      </div>
                      <p class="text-sm font-serif-editorial leading-relaxed">«${esc(item.step2Prompt)}»</p>
                    </div>
                  </div>
                </div>

                <!-- Outcome -->
                <div class="pt-3 border-t border-theme text-sm leading-relaxed">
                  <span class="font-semibold text-accent">${esc(t.outcomeLabel)}:</span>
                  <span class="text-muted ml-1">${esc(item.outcome)}</span>
                </div>
              </article>
            `).join('')}
          </div>
        </div>
      `;
    }

    /* VIEW 4: AGENTS & LOCAL MODELS (A-1, L-1) */
    function renderAgents() {
      const ag = CONTENT[state.lang].agents;
      return `
        <div class="space-y-10 animate-view">
          <!-- Gentle Top Banner -->
          <div class="p-4 sm:p-5 rounded-2xl surface-warm flex flex-wrap items-center justify-between gap-3">
            <p class="text-sm text-muted">
              ${esc(ag.bannerText)}
              <button onclick="navigateTo('basics', { lesson: 1 })" class="font-medium text-accent underline underline-offset-4 cursor-pointer ml-1">
                ${esc(ag.bannerLink)}
              </button>.
            </p>
          </div>

          <div>
            <h1 class="font-serif-editorial text-2xl sm:text-4xl font-semibold mb-2">${esc(ag.heading)}</h1>
            <p class="text-sm sm:text-base text-muted max-w-3xl">${esc(ag.sub)}</p>
          </div>

          <!-- A-1: AI Agents -->
          <section class="p-6 sm:p-10 rounded-3xl surface-card space-y-7">
            <header class="space-y-2 pb-5 border-b border-theme">
              <span class="inline-block px-2.5 py-1 rounded-lg text-xs font-semibold bg-accent-soft">${esc(ag.a1.code)}</span>
              <h2 class="font-serif-editorial text-2xl sm:text-3xl font-semibold">${esc(ag.a1.title)}</h2>
              <p class="text-base text-muted">${esc(ag.a1.lead)}</p>
            </header>

            <!-- Contrast: Chat vs Agent -->
            <div class="space-y-3">
              <h3 class="font-serif-editorial text-xl font-semibold">${esc(ag.a1.compareHeading)}</h3>
              <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div class="p-5 rounded-2xl surface-subtle space-y-3">
                  <h4 class="font-serif-editorial font-semibold text-base">${esc(ag.a1.chatTitle)}</h4>
                  <ul class="space-y-2 text-sm text-muted leading-relaxed">
                    ${ag.a1.chatPoints.map(pt => `<li class="flex gap-2"><span>•</span><span>${esc(pt)}</span></li>`).join('')}
                  </ul>
                </div>
                <div class="p-5 rounded-2xl surface-warm border border-[var(--accent-border)] space-y-3">
                  <h4 class="font-serif-editorial font-semibold text-base text-accent">${esc(ag.a1.agentTitle)}</h4>
                  <ul class="space-y-2 text-sm leading-relaxed">
                    ${ag.a1.agentPoints.map(pt => `<li class="flex gap-2 text-accent"><span>•</span><span class="text-[var(--text)]">${esc(pt)}</span></li>`).join('')}
                  </ul>
                </div>
              </div>
            </div>

            <!-- Everyday Example -->
            <div class="p-5 rounded-2xl surface-warm space-y-2">
              <h3 class="font-serif-editorial text-lg font-semibold">${esc(ag.a1.exampleHeading)}</h3>
              <p class="text-sm sm:text-base text-muted leading-relaxed">${esc(ag.a1.exampleText)}</p>
            </div>

            <!-- Human in the loop -->
            <div class="p-5 rounded-2xl bg-accent-soft space-y-1.5">
              <h3 class="font-serif-editorial text-base font-semibold text-accent">${esc(ag.a1.safetyTitle)}</h3>
              <p class="text-sm sm:text-base text-[var(--text)] leading-relaxed">${esc(ag.a1.safetyText)}</p>
            </div>
          </section>

          <!-- L-1: Local Models -->
          <section id="local-section" class="p-6 sm:p-10 rounded-3xl surface-card space-y-7 scroll-mt-28">
            <header class="space-y-2 pb-5 border-b border-theme">
              <span class="inline-block px-2.5 py-1 rounded-lg text-xs font-semibold bg-accent-soft">${esc(ag.l1.code)}</span>
              <h2 class="font-serif-editorial text-2xl sm:text-3xl font-semibold">${esc(ag.l1.title)}</h2>
              <p class="text-base text-muted">${esc(ag.l1.lead)}</p>
            </header>

            <!-- Why local -->
            <div class="space-y-3">
              <h3 class="font-serif-editorial text-xl font-semibold">${esc(ag.l1.whyHeading)}</h3>
              <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                ${ag.l1.whyPoints.map(pt => `
                  <div class="p-5 rounded-2xl surface-warm space-y-1.5">
                    <h4 class="font-serif-editorial font-semibold text-base">${esc(pt.title)}</h4>
                    <p class="text-sm text-muted leading-relaxed">${esc(pt.text)}</p>
                  </div>
                `).join('')}
              </div>
            </div>

            <!-- Honest Filter Callout (Terracotta / Gold) -->
            <div class="p-6 sm:p-7 rounded-2xl bg-accent-2-soft space-y-4">
              <div class="space-y-1.5">
                <h3 class="font-serif-editorial text-xl font-semibold text-accent-2">${esc(ag.l1.filterHeading)}</h3>
                <p class="text-sm text-[var(--text)] opacity-90">${esc(ag.l1.filterIntro)}</p>
              </div>
              <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                ${ag.l1.filterPoints.map(pt => `
                  <div class="p-4 rounded-xl surface-card space-y-1.5">
                    <h4 class="font-semibold text-sm">${esc(pt.title)}</h4>
                    <p class="text-xs sm:text-sm text-muted leading-relaxed">${esc(pt.text)}</p>
                  </div>
                `).join('')}
              </div>
            </div>

            <!-- How to try gently -->
            <div class="p-5 rounded-2xl surface-subtle space-y-2">
              <h3 class="font-serif-editorial text-lg font-semibold">${esc(ag.l1.howHeading)}</h3>
              <p class="text-sm sm:text-base text-muted leading-relaxed">${esc(ag.l1.howText)}</p>
            </div>
          </section>
        </div>
      `;
    }

    /* VIEW 4.5: MEET MORE PARTNERS */
    function renderModels() {
      const m = CONTENT[state.lang].models;
      return `
        <div class="space-y-10 animate-view">
          <div>
            <div class="text-xs font-semibold uppercase tracking-wider text-accent-2 mb-2">${esc(m.eyebrow)}</div>
            <h1 class="font-serif-editorial text-2xl sm:text-4xl font-semibold mb-2">${esc(m.heading)}</h1>
            <p class="text-sm sm:text-base text-muted max-w-3xl">${esc(m.sub)}</p>
          </div>

          <div class="p-4 sm:p-5 rounded-2xl surface-warm flex flex-col sm:flex-row sm:items-center justify-between gap-3">
            <p class="text-sm text-muted">${esc(m.note)}</p>
            <button onclick="navigateTo('basics', { lesson: 3 })" class="px-4 py-2 rounded-xl text-sm font-medium bg-accent whitespace-nowrap self-start sm:self-auto cursor-pointer no-print">
              ${esc(m.noteBtn)}
            </button>
          </div>

          <!-- Cheat sheet: table on desktop, stacked rows on phones -->
          <section class="p-6 sm:p-10 rounded-3xl surface-card space-y-5">
            <header class="space-y-2">
              <span class="inline-block px-2.5 py-1 rounded-lg text-xs font-semibold bg-accent-soft">${esc(m.cheatEyebrow)}</span>
              <h2 class="font-serif-editorial text-2xl sm:text-3xl font-semibold">${esc(m.cheatHeading)}</h2>
            </header>
            <div class="text-sm">
              <div class="hidden md:grid md:grid-cols-[1.4fr_1fr_1.4fr] gap-4 px-4 pb-2 text-xs font-semibold uppercase tracking-wider text-muted border-b border-theme">
                ${m.cheatHeaders.map(h => `<span>${esc(h)}</span>`).join('')}
              </div>
              <div class="divide-y divide-[var(--border)]">
                ${m.cheatRows.map(r => `
                  <div class="grid grid-cols-1 md:grid-cols-[1.4fr_1fr_1.4fr] gap-1 md:gap-4 px-1 md:px-4 py-3">
                    <span>${esc(r[0])}</span>
                    <span class="font-semibold text-accent"><span class="md:hidden font-normal text-muted">${esc(m.cheatWho)}: </span>${esc(r[1])}</span>
                    <span class="text-xs md:text-sm text-muted">${esc(r[2])}</span>
                  </div>
                `).join('')}
              </div>
            </div>
            <p class="text-xs sm:text-sm text-muted italic">${esc(m.cheatFootnote)}</p>
          </section>

          <!-- More partners -->
          <section class="space-y-4">
            <header class="space-y-2">
              <span class="inline-block px-2.5 py-1 rounded-lg text-xs font-semibold bg-accent-soft">${esc(m.cardsEyebrow)}</span>
              <h2 class="font-serif-editorial text-2xl sm:text-3xl font-semibold">${esc(m.cardsHeading)}</h2>
            </header>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
              ${m.cards.map(renderModelCard).join('')}
            </div>
          </section>

          <!-- Open models -->
          <div class="p-5 sm:p-6 rounded-2xl bg-accent-soft flex flex-col sm:flex-row sm:items-center justify-between gap-4">
            <div class="space-y-1.5">
              <h3 class="font-serif-editorial text-lg font-semibold">${esc(m.openHeading)}</h3>
              <p class="text-sm text-[var(--text)] leading-relaxed">${esc(m.openText)}</p>
            </div>
            <button onclick="navigateTo('agents', { anchor: 'local-section' })" class="px-4 py-2 rounded-xl text-sm font-medium bg-accent whitespace-nowrap self-start sm:self-auto cursor-pointer no-print">
              ${esc(m.openBtn)} →
            </button>
          </div>

          <!-- Access from Russia -->
          <section class="p-6 sm:p-10 rounded-3xl surface-card space-y-5">
            <h2 class="font-serif-editorial text-2xl sm:text-3xl font-semibold">${esc(m.accessHeading)}</h2>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
              ${['ok', 'vpn'].map(k => `
                <div class="p-5 rounded-2xl surface-warm space-y-2.5">
                  ${renderAccessBadge(k)}
                  <p class="text-sm sm:text-base leading-relaxed">${esc(m.accessLists[k])}</p>
                </div>
              `).join('')}
            </div>
            <p class="text-xs sm:text-sm text-muted">${esc(m.accessNote)}</p>
          </section>
        </div>
      `;
    }

    /* VIEW 5: GLOSSARY & ANCHORS */
    function renderGlossary() {
      const gl = CONTENT[state.lang].glossary;
      return `
        <div class="space-y-12 animate-view">
          <div>
            <h1 class="font-serif-editorial text-2xl sm:text-4xl font-semibold mb-2">${esc(gl.heading)}</h1>
            <p class="text-sm sm:text-base text-muted max-w-3xl">${esc(gl.sub)}</p>
          </div>

          <!-- Interactive Accordion (7 Terms) -->
          <section class="rounded-3xl surface-card divide-y divide-[var(--border)] overflow-hidden">
            ${gl.terms.map((item, idx) => {
              const isOpen = state.openGlossary === idx;
              return `
                <div>
                  <button onclick="toggleGlossaryItem(${idx})" class="w-full px-6 py-5 text-left flex items-center justify-between gap-4 hover:bg-[var(--surface-warm)] transition-colors cursor-pointer" aria-expanded="${isOpen}">
                    <span class="font-serif-editorial text-lg font-semibold ${isOpen ? 'text-accent' : ''}">${esc(item.term)}</span>
                    <span class="w-7 h-7 rounded-full surface-subtle flex items-center justify-center text-sm font-medium shrink-0 transition-transform ${isOpen ? 'rotate-45 text-accent' : 'text-muted'}">+</span>
                  </button>
                  ${isOpen ? `
                    <div class="px-6 pb-6 pt-1 text-sm sm:text-base text-muted leading-relaxed">
                      ${esc(item.def)}
                    </div>
                  ` : ''}
                </div>
              `;
            }).join('')}
          </section>

          <!-- 3 Quick Reference Cards -->
          <section class="space-y-5">
            <h2 class="font-serif-editorial text-2xl font-semibold">${esc(gl.cardsHeading)}</h2>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
              <!-- Card 1: Where to Start -->
              <div class="p-6 rounded-2xl surface-card flex flex-col justify-between gap-4">
                <div class="space-y-2">
                  <h3 class="font-serif-editorial text-lg font-semibold">${esc(gl.refWhereTitle)}</h3>
                  <p class="text-sm text-muted leading-relaxed">${esc(gl.refWhereText)}</p>
                </div>
                <button onclick="navigateTo('basics', { lesson: 3 })" class="text-left text-sm font-medium text-accent hover:underline cursor-pointer no-print">
                  ${esc(gl.refWhereLink)}
                </button>
              </div>

              <!-- Card 2: The Café Rule -->
              <div class="p-6 rounded-2xl surface-card flex flex-col justify-between gap-4">
                <div class="space-y-2">
                  <h3 class="font-serif-editorial text-lg font-semibold">${esc(gl.refCafeTitle)}</h3>
                  <p class="text-sm text-muted leading-relaxed">${esc(gl.refCafeText)}</p>
                </div>
                <button onclick="navigateTo('basics', { lesson: 6 })" class="text-left text-sm font-medium text-accent hover:underline cursor-pointer no-print">
                  ${esc(gl.refCafeLink)}
                </button>
              </div>
            </div>

            <!-- Card 3: 4 Steering Phrases (full width with copy buttons) -->
            <div class="p-6 sm:p-7 rounded-2xl surface-warm space-y-4">
              <h3 class="font-serif-editorial text-lg font-semibold">${esc(gl.refPhrasesTitle)}</h3>
              <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                ${gl.refPhrases.map(ph => `
                  <div class="p-4 rounded-xl surface-card flex items-start justify-between gap-3">
                    <p class="text-sm font-serif-editorial italic leading-relaxed">«${esc(ph)}»</p>
                    ${renderCopyBtn(ph)}
                  </div>
                `).join('')}
              </div>
            </div>
          </section>
        </div>
      `;
    }

    function renderMain() {
      const main = document.getElementById('app-main');
      if (state.tab === 'home') main.innerHTML = renderHome();
      else if (state.tab === 'basics') main.innerHTML = renderBasics();
      else if (state.tab === 'scenarios') main.innerHTML = renderScenarios();
      else if (state.tab === 'agents') main.innerHTML = renderAgents();
      else if (state.tab === 'models') main.innerHTML = renderModels();
      else if (state.tab === 'glossary') main.innerHTML = renderGlossary();
    }

    function renderAll() {
      renderChrome();
      renderMain();
    }

    /* ------------------------------------------------------------------------
       6. BOOTSTRAP
       ------------------------------------------------------------------------ */
    document.addEventListener('DOMContentLoaded', () => {
      initLanguage();
      initTheme();
      renderAll();
    });
  </script>
</body>
</html>
